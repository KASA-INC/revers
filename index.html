<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Revers</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Revers">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --text: #f4f5f7;
    --muted: #8d909a;
    --red: #ff3b4a;
    --blue: #3e8bff;
    --glass: rgba(22, 23, 28, .55);
    --glass-line: rgba(255, 255, 255, .09);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    color: var(--text); -webkit-text-size-adjust: 100%;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  button { touch-action: manipulation; font: inherit; }
  svg.i { width: 1em; height: 1em; display: block; flex: none; }

  /* ---------- Fullskjerm-bilde ---------- */
  .stage { position: fixed; inset: 0; background: #000; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video.mirror { transform: scaleX(-1); }
  .track { position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 7; }
  .track div { height: 100%; width: 0; background: var(--red); }

  .empty {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted);
    background: radial-gradient(circle at 50% 42%, #1c1e26, #060709 70%);
  }
  .empty .big {
    display: inline-flex; align-items: center; gap: 10px; padding: 18px 28px; border-radius: 999px; border: 0;
    background: var(--text); color: #0b0c0f; font-weight: 700; font-size: 17px; cursor: pointer; transition: transform .15s;
  }
  .empty .big .i { font-size: 24px; }
  .empty .big:active, .empty .big:hover { transform: scale(1.04); }
  .empty p { margin: 0; max-width: 320px; font-size: 14px; }
  .empty p[hidden] { display: none; }

  /* Nedtelling */
  .count {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none;
    background: rgba(0, 0, 0, .22); color: #fff; font-weight: 800; font-size: min(42vw, 42vh);
    font-variant-numeric: tabular-nums; text-shadow: 0 10px 50px rgba(0, 0, 0, .5);
  }
  .count[hidden] { display: none; }
  .count span { display: block; line-height: 1; }
  .count.tick span { animation: tick 1s ease-out both; }
  @keyframes tick {
    0% { transform: scale(1.4); opacity: 0; }
    15% { opacity: 1; }
    75% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.92); opacity: 0; }
  }

  /* ---------- Glass-kontroller oppå bildet ---------- */
  .glass {
    background: var(--glass); border: 1px solid var(--glass-line); color: #fff;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  }
  .round {
    width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center;
    font-size: 22px; cursor: pointer; transition: opacity .2s, transform .15s;
  }
  .round.lg { width: 56px; height: 56px; font-size: 26px; }
  .round:active:not(:disabled) { transform: scale(.94); }
  .round:disabled { opacity: .3; cursor: default; }
  .round[hidden] { display: none; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 40px max(14px, env(safe-area-inset-left));
    background: linear-gradient(rgba(0, 0, 0, .38), transparent);
  }
  .top > * { pointer-events: auto; }
  .top-right { display: flex; gap: 10px; margin-left: auto; }
  .pill {
    display: none; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .pill.show { display: inline-flex; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 50px max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: linear-gradient(transparent, rgba(0, 0, 0, .55));
  }
  .bottom > * { pointer-events: auto; }

  .options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; transition: opacity .2s; }
  .seg { display: flex; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    width: 44px; height: 38px; border-radius: 999px; border: 0; padding: 0; display: grid; place-items: center;
    background: transparent; color: rgba(255, 255, 255, .6); font-size: 20px; cursor: pointer; transition: background .2s, color .2s;
  }
  .seg button.on { background: var(--blue); color: #fff; }
  .seg button:disabled { cursor: default; }
  .chip {
    height: 46px; min-width: 46px; padding: 0 13px; border-radius: 999px; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer;
    color: rgba(255, 255, 255, .6); transition: background .2s, color .2s, border-color .2s;
  }
  .chip .i { font-size: 20px; }
  .chip[aria-pressed="true"] { color: #fff; background: rgba(62, 139, 255, .38); border-color: rgba(62, 139, 255, .55); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip[hidden] { display: none; }
  .chip span:empty { display: none; }
  #folderName { max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }

  .panel {
    display: flex; align-items: center; gap: 12px; width: min(420px, 100%);
    padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 20px;
  }
  .panel[hidden] { display: none; }
  .panel input { flex: 1; min-width: 0; height: 32px; accent-color: var(--blue); }
  .panel .val { min-width: 34px; text-align: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .panel .round { width: 36px; height: 36px; font-size: 17px; background: rgba(255, 255, 255, .1); border: 0; color: #fff; }

  .dock { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(400px, 100%); }
  .dock #sideBtn { justify-self: start; }
  .dock #saveBtn { justify-self: end; }
  #saveBtn.working { animation: pulse 1s infinite; }
  body.busy .options, body.busy #sideBtn, body.busy #saveBtn, body.busy .panel { opacity: 0; pointer-events: none; }
  body.nocam .bottom, body.nocam #flipBtn { display: none; }

  .main {
    width: 82px; height: 82px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; position: relative;
    display: grid; place-items: center; background: transparent; color: #fff; font-size: 30px; transition: transform .15s;
  }
  .main::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .95); }
  .main .core {
    width: 66px; height: 66px; border-radius: 50%; background: var(--red); display: grid; place-items: center; transition: all .2s ease;
  }
  .main.recording .core { width: 34px; height: 34px; border-radius: 9px; }
  .main.clip::before { border-color: rgba(255, 255, 255, .5); }
  .main.clip .core { background: var(--blue); }
  .main:active:not(:disabled) { transform: scale(.95); }
  .main:disabled { opacity: .3; cursor: default; }

  /* Melding */
  .toast {
    position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 58px); z-index: 9;
    transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 28px);
    padding: 11px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .i { font-size: 20px; color: #4cd97b; }
  .toast.err .i { color: #ffb020; }
  .toast.action { pointer-events: auto; padding: 6px 6px 6px 16px; }
  .toast button {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 0; border-radius: 999px;
    background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .toast button .i { color: #fff; font-size: 18px; }
  .toast button[hidden] { display: none; }

  /* ---------- Knapper: hvite ikoner uten fyll, med myk skygge ---------- */
  .round.glass, .chip.glass, .seg.glass {
    background: transparent; border-color: transparent;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .round.glass, .chip, .seg button, .main {
    color: #fff;
    /* tett kontur + stor, dus skygge, så hvitt synes også på lys bakgrunn */
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45)) drop-shadow(0 3px 16px rgba(0, 0, 0, .5));
  }
  .round.glass { font-size: 28px; }
  .round.lg { font-size: 32px; }
  .chip .i, .seg button .i { font-size: 24px; }
  .chip { font-size: 15px; min-width: 44px; padding: 0 9px; }
  .options { gap: 4px; }
  .seg { padding: 0; gap: 0; }
  .seg button { width: 44px; height: 46px; }
  /* Av = dempet hvit, på = helt hvit */
  .chip, .seg button { color: rgba(255, 255, 255, .62); }
  .chip[aria-pressed="true"], .seg button.on { color: #fff; background: transparent; border-color: transparent; }
  .main.clip .core { background: transparent; }
  .main.clip::before { border-color: rgba(255, 255, 255, .95); }
  .main .core .i { font-size: 34px; }
  /* Mobil: litt større ikoner innenfor samme knappebredde */
  .chip .i, .seg button .i { font-size: 26px; }

  /* Desktop: tydelig større ikoner og knapper */
  @media (min-width: 721px) and (hover: hover) {
    .options { gap: 12px; }
    .chip { height: 60px; min-width: 60px; padding: 0 12px; font-size: 19px; gap: 8px; }
    .chip .i, .seg button .i { font-size: 34px; }
    .seg button { width: 60px; height: 60px; }
    .round.glass { width: 60px; height: 60px; font-size: 34px; }
    .round.lg { width: 72px; height: 72px; font-size: 42px; }
    .dock { width: min(520px, 100%); }
    .main { width: 96px; height: 96px; }
    .main .core { width: 78px; height: 78px; }
    .main.recording .core { width: 40px; height: 40px; border-radius: 10px; }
    .main .core .i { font-size: 40px; }
    .bottom { gap: 18px; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
    .top { padding-top: max(20px, env(safe-area-inset-top)); padding-right: max(22px, env(safe-area-inset-right)); }
    .pill { height: 42px; font-size: 17px; padding: 0 16px; }
  }

  @media (max-width: 360px) {
    .options { gap: 6px; }
    .chip { min-width: 42px; height: 42px; padding: 0 10px; }
    .seg button { width: 40px; height: 34px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="live" class="mirror" autoplay muted playsinline></video>
    <canvas id="out"></canvas>
    <div class="track"><div id="progress"></div></div>
    <div id="count" class="count" hidden></div>
    <div id="empty" class="empty">
      <button id="camBtn" class="big"><span data-icon="videocamera-record-bold"></span>Start kamera</button>
      <p id="emptyMsg" hidden></p>
    </div>
  </div>

  <div class="top">
    <div id="pill" class="pill glass"></div>
    <div class="top-right">
      <button id="installBtn" class="round glass" hidden aria-label="Installer app" title="Installer app"><span data-icon="download-minimalistic-bold"></span></button>
      <button id="flipBtn" class="round glass" hidden aria-label="Bytt kamera" title="Bytt kamera"><span data-icon="camera-rotate-bold"></span></button>
    </div>
  </div>

  <div class="bottom">
    <div id="voicePanel" class="panel glass" hidden>
      <span data-icon="microphone-bold"></span>
      <input type="range" id="pitch" min="-12" max="12" step="1" value="0" aria-label="Stemme">
      <span class="val" id="pitchVal">0</span>
      <button id="pitchReset" class="round" aria-label="Nullstill stemme" title="Nullstill"><span data-icon="restart-bold"></span></button>
    </div>
    <div class="options">
      <div class="seg glass" role="group" aria-label="Retning">
        <button id="dirRev" class="on" aria-label="Baklengs" title="Baklengs"><span data-icon="rewind-back-bold"></span></button>
        <button id="dirFwd" aria-label="Forlengs" title="Forlengs"><span data-icon="rewind-forward-bold"></span></button>
      </div>
      <button id="timerBtn" class="chip glass" aria-label="Nedtelling" title="Nedtelling"><span data-icon="stopwatch-bold"></span><span id="timerVal"></span></button>
      <button id="loopBtn" class="chip glass" aria-label="Loop" title="Loop"><span data-icon="repeat-bold"></span></button>
      <button id="soundBtn" class="chip glass" aria-label="Lyd" title="Lyd"><span id="soundIcon"></span></button>
      <button id="voiceBtn" class="chip glass" aria-label="Stemme" title="Stemme"><span data-icon="microphone-bold"></span></button>
      <button id="folderBtn" class="chip glass" aria-label="Velg mappe" title="Velg mappe"><span data-icon="folder-bold"></span><span id="folderName"></span></button>
    </div>
    <div class="dock">
      <button id="sideBtn" class="round lg glass" disabled><span id="sideIcon"></span></button>
      <button id="mainBtn" class="main" disabled aria-label="Ta opp"><span class="core" id="mainIcon"></span></button>
      <button id="saveBtn" class="round lg glass" disabled aria-label="Lagre" title="Lagre"><span id="saveIcon"></span></button>
    </div>
  </div>

  <div id="toast" class="toast glass" role="status"><span id="toastIcon"></span><span id="toastText"></span><button id="toastBtn" hidden></button></div>

// Innstillinger huskes mellom gangene
const settings = { direction: 'reverse', loopOn: true, soundOn: true, timerSecs: 3, pitchSemis: 0 };
try { Object.assign(settings, JSON.parse(localStorage.getItem('revers-settings') || '{}')); } catch (e) {}

const hasClip = () => frames.length >= 2 && !recording;
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const signed = v => (v > 0 ? '+' : '') + v;

// ---------- Oppdater hele grensesnittet ut fra tilstanden ----------
function render() {
  const clipMode = !liveVisible && hasClip();
  const busy = recording || counting;
  document.body.classList.toggle('busy', busy);
  document.body.classList.toggle('nocam', !stream);

  // Hovedknapp: opptak i kameramodus (avbryter under nedtelling), spill/stopp i klippmodus
  mainBtn.disabled = !stream || exporting;
  mainBtn.classList.toggle('recording', busy);
  mainBtn.classList.toggle('clip', clipMode && !busy);
  if (clipMode && !busy) {
    $('mainIcon').innerHTML = icon(playing ? 'stop-bold' : 'play-bold');
    mainBtn.setAttribute('aria-label', playing ? 'Stopp' : 'Spill av');
  } else {
    $('mainIcon').innerHTML = '';
    mainBtn.setAttribute('aria-label', recording ? 'Stopp opptak' : counting ? 'Avbryt' : 'Ta opp');
  }

  // Sideknapp: tilbake til kamera (fra klipp) eller se klippet igjen (fra kamera)
  $('sideIcon').innerHTML = icon(clipMode ? 'videocamera-bold' : 'play-bold');
  sideBtn.setAttribute('aria-label', clipMode ? 'Nytt opptak' : 'Se klippet');
  sideBtn.title = sideBtn.getAttribute('aria-label');
  sideBtn.disabled = clipMode ? exporting : (!hasClip() || busy);

  $('saveIcon').innerHTML = icon('download-minimalistic-bold');
  saveBtn.disabled = !hasClip() || exporting;
  saveBtn.classList.toggle('working', exporting);

  dirRev.classList.toggle('on', direction === 'reverse');
  dirFwd.classList.toggle('on', direction === 'forward');
  dirRev.disabled = dirFwd.disabled = busy || exporting;

  $('timerVal').textContent = timerSecs ? timerSecs + 's' : '';
  timerBtn.setAttribute('aria-pressed', timerSecs > 0);
  loopBtn.setAttribute('aria-pressed', loopOn);
  soundBtn.setAttribute('aria-pressed', soundOn && hasMic);
  soundBtn.disabled = !hasMic || exporting;
  $('soundIcon').innerHTML = icon(soundOn && hasMic ? 'volume-loud-bold' : 'volume-cross-bold');

  const v = +pitchInput.value;
  pitchVal.textContent = signed(v);
  // Knappen lyser når stemmen er endret; tallet vises i panelet
  voiceBtn.setAttribute('aria-pressed', v !== 0 || !voicePanel.hidden);
  voiceBtn.title = v ? 'Stemme ' + signed(v) : 'Stemme';
  pitchInput.disabled = exporting;
  pitchReset.disabled = exporting || v === 0;

  folderBtn.hidden = !fsSupported || isTouch;
  $('folderName').textContent = dirHandle ? dirHandle.name : '';
  folderBtn.setAttribute('aria-pressed', !!dirHandle);
  folderBtn.disabled = exporting;

  $('flipBtn').hidden = !(stream && multiCam && liveVisible && !busy && !exporting);

}

let toastTimer = null;
function toast(text, ok = true) {
  const t = $('toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ok ? 3000 : 6000);
}

// Melding med knapp (blir stående til den trykkes eller lukkes)
function toastAction(text, label, iconName, onTap) {
  const t = $('toast'), b = $('toastBtn');

function showLive(on) {
  liveVisible = on;
  live.style.display = on ? 'block' : 'none';
  out.style.display = on ? 'none' : 'block';
  if (on && live.play) live.play().catch(() => {});
  render();
}

function goToCamera() {
  stopPlayback(); progress.style.width = '0'; showLive(true);
}

// ---------- Kamera ----------
// Frontkameraet speilvendes (som et speil), bakkameraet vises som det er
const mirrored = () => facing !== 'environment';

async function startCamera(want) {
  const open = async mode => {
    const video = { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 720 } };
    try { const s = await navigator.mediaDevices.getUserMedia({ video, audio: true }); hasMic = true; return s; }
    catch (e) { const s = await navigator.mediaDevices.getUserMedia({ video }); hasMic = false; return s; }
  };
  // Telefoner (særlig iPhone) kan bare bruke ett kamera om gangen: slipp det gamle først
  const prevFacing = stream ? facing : null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  let next;
  try { next = await open(want); }
  catch (e) {
    // Byttet feilet – prøv å få tilbake kameraet vi hadde
    if (prevFacing) { try { next = await open(prevFacing); } catch (e2) {} }
    if (!next) { $('emptyMsg').textContent = 'Fikk ikke tilgang til kameraet.'; $('emptyMsg').hidden = false; $('empty').style.display = ''; render(); return; }
    toast('Fikk ikke byttet kamera.', false);
  }
  stream = next;
  facing = stream.getVideoTracks()[0].getSettings().facingMode || want;

  // Nytt videoelement for hver kamerastrøm. Safari på iPhone beholder ellers
  // størrelsen fra forrige kamera, så bildet blir mindre med svarte kanter.
  const fresh = live.cloneNode(false);
  fresh.muted = true; fresh.playsInline = true; fresh.autoplay = true;
  fresh.classList.toggle('mirror', mirrored());
  fresh.srcObject = stream;
  live.srcObject = null;
  live.replaceWith(fresh);
  live = fresh;
  live.play().catch(() => {});
  $('empty').style.display = 'none';
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    multiCam = cams.length > 1;
  } catch (e) { multiCam = false; }
  showLive(true);
}

camBtn.onclick = () => { unlockAudio(); startCamera('user'); };
let switching = false;
$('flipBtn').onclick = async () => {
  if (switching) return;
  switching = true;
  try { await startCamera(facing === 'environment' ? 'user' : 'environment'); }
  finally { switching = false; }
};

// iPhone/iPad spiller bare lyd hvis lyden «låses opp» fra et trykk
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state !== 'running') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, true);

// ---------- Nedtelling ----------
function beep(freq) {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.start(t); o.stop(t + 0.13);
  } catch (e) {}
}

function showCount(n) {
  countEl.hidden = false;
  countEl.innerHTML = `<span>${n}</span>`;
  countEl.classList.remove('tick'); void countEl.offsetWidth; countEl.classList.add('tick');
  beep(880);
}

function startCountdown() {
  if (!timerSecs) { startRecording(); return; }
  stopPlayback();
  voicePanel.hidden = true;
  counting = true;
  let n = timerSecs;
  showCount(n);
  render();
  countTimer = setInterval(() => {
    n--;
    if (n > 0) { showCount(n); return; }
    clearInterval(countTimer); countTimer = null;
    counting = false; countEl.hidden = true;
    startRecording();
  }, 1000);
}

function cancelCountdown() {
  clearInterval(countTimer); countTimer = null;
  counting = false; countEl.hidden = true;
  render();
}

mainBtn.onclick = () => {
  if (counting) cancelCountdown();
  else if (recording) stopRecording();
  else if (!liveVisible && hasClip()) playing ? (stopPlayback(), render()) : startPlayback();
  else startCountdown();
};

// Fra et klipp går «Nytt opptak» bare tilbake til kameraet – opptak starter først ved neste trykk.
sideBtn.onclick = () => { if (!liveVisible) goToCamera(); else if (hasClip()) startPlayback(); };

// ---------- Opptak ----------
function clearCache() {
  cache.forEach(b => b.close && b.close());
  cache.clear(); decoding.clear();
}

function startRecording() {
  stopPlayback();
  voicePanel.hidden = true;
  clipId++; clearCache();
  frames = []; origAudio = procFwd = procRev = null; audioChunks = [];
  // Klippet får samme format som kameraet (stående på mobil, liggende på Mac)
  const vw = live.videoWidth || 1280, vh = live.videoHeight || 720;
  const s = Math.min(1, LONG_SIDE / Math.max(vw, vh));
  clipW = Math.round(vw * s / 2) * 2; clipH = Math.round(vh * s / 2) * 2;
  grab.width = clipW; grab.height = clipH;
  recording = true; recStart = performance.now();
  pill.className = 'pill glass show';
  showLive(true);

  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length && soundOn) {
    audioRecorder = new MediaRecorder(new MediaStream(audioTracks));
    audioRecorder.ondataavailable = e => e.data.size && audioChunks.push(e.data);
    audioRecorder.start();
  } else audioRecorder = null;

  captureLoop();
}

function captureLoop() {
  if (!recording) return;
  const t = performance.now() - recStart;
  if (t >= MAX_SECONDS * 1000) { stopRecording(); return; }
  progress.style.width = (t / (MAX_SECONDS * 1000) * 100) + '%';
  progress.style.background = 'var(--red)';
  pill.innerHTML = `<span class="dot"></span>${fmt(t)}`;

  // Tegn bildet (speilvendt for frontkamera, som forhåndsvisningen) og lagre som JPEG
  const vw = live.videoWidth, vh = live.videoHeight;
  if (vw && vh) {
    const scale = Math.max(clipW / vw, clipH / vh);
    const dw = vw * scale, dh = vh * scale;
    gctx.save();
    if (mirrored()) { gctx.translate(clipW, 0); gctx.scale(-1, 1); }
    gctx.drawImage(live, (clipW - dw) / 2, (clipH - dh) / 2, dw, dh);
    gctx.restore();
    const id = clipId;
    pendingEncodes++;
    grab.toBlob(blob => {
      pendingEncodes--;
      if (blob && id === clipId) frames.push({ blob, t });
    }, 'image/jpeg', 0.85);
  }
  if (live.requestVideoFrameCallback) live.requestVideoFrameCallback(captureLoop);
  else requestAnimationFrame(captureLoop);
}

async function stopRecording() {
  if (!recording) return;
  recording = false;
  progress.style.width = '0';
  render();

  if (audioRecorder) {
    await new Promise(res => { audioRecorder.onstop = res; audioRecorder.stop(); });
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const buf = await audioCtx.decodeAudioData(await new Blob(audioChunks).arrayBuffer());
      origAudio = buf;
      applyPitch();
    } catch (e) { console.warn('Kunne ikke dekode lyd', e); origAudio = procFwd = procRev = null; }
  }
  // vent til de siste bildene er ferdig komprimert
  await new Promise(r => { const check = () => pendingEncodes <= 0 ? r() : setTimeout(check, 20); check(); });
  frames.sort((a, b) => a.t - b.t);
  out.width = clipW; out.height = clipH;
  if (frames.length < 2) { toast('For kort – prøv igjen.', false); render(); return; }
  startPlayback(); // spiller i valgt retning
}

// ---------- Stemme (tonehøyde) ----------
// Endrer tonehøyden uten å endre lengden:
// 1) strekker lyden i tid med WSOLA (uten å endre tonen), 2) resampler tilbake til opprinnelig lengde.
// ratio > 1 = lysere stemme, ratio < 1 = dypere stemme.
function pitchShift(buf, ratio) {
  const n = buf.length, chs = buf.numberOfChannels;
  const N = Math.round(buf.sampleRate * 0.04) & ~1; // ca. 40 ms ramme
  const Hs = N / 2, Ha = Hs / ratio, tol = Math.round(Hs / 4);
  const win = new Float32Array(N);
  for (let j = 0; j < N; j++) win[j] = 0.5 - 0.5 * Math.cos(2 * Math.PI * j / N);

  // Monomiks brukes til å finne beste overlapp
  const mono = new Float32Array(n);
  for (let c = 0; c < chs; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chs; }

  const count = Math.floor((n - N - tol) / Ha);
  const L = count * Hs + N;
  const starts = new Int32Array(count);
  let prev = 0;
  for (let k = 0; k < count; k++) {
    const a = Math.round(k * Ha);
    if (k === 0) { starts[k] = a; prev = a; continue; }
    const nat = prev + Hs; // naturlig fortsettelse av forrige ramme
    let best = 0, bestScore = -Infinity;
    for (let d = -tol; d <= tol; d += 2) {
      const s = a + d;
      if (s < 0 || s + N > n || nat + N > n) continue;
      let score = 0;
      for (let j = 0; j < N; j += 4) score += mono[s + j] * mono[nat + j];
      if (score > bestScore) { bestScore = score; best = d; }
    }
    starts[k] = Math.max(0, Math.min(n - N, a + best));
    prev = starts[k];
  }

  const res = audioCtx.createBuffer(chs, n, buf.sampleRate);
  for (let c = 0; c < chs; c++) {
    const src = buf.getChannelData(c);
    const st = new Float32Array(L), norm = new Float32Array(L);
    for (let k = 0; k < count; k++) {
      const o = k * Hs, s = starts[k];
      for (let j = 0; j < N; j++) { st[o + j] += src[s + j] * win[j]; norm[o + j] += win[j]; }
    }
    for (let i = 0; i < L; i++) if (norm[i] > 1e-3) st[i] /= norm[i];
    const dst = res.getChannelData(c);
    for (let i = 0; i < n; i++) {
      const pos = i * ratio;
      if (pos >= L - 1) break;
      const p = pos | 0, f = pos - p;
      dst[i] = st[p] + (st[p + 1] - st[p]) * f;
    }
  }
  return res;
}

// Ferdigbehandlet lyd (med stemmeendring) i begge retninger
function currentAudio() { return direction === 'forward' ? procFwd : procRev; }
function applyPitch() {
  if (!origAudio) { procFwd = procRev = null; return; }
  procFwd = pitchSemis !== 0 ? pitchShift(origAudio, Math.pow(2, pitchSemis / 12)) : origAudio;
  procRev = reverseBuffer(procFwd);
}

function reverseBuffer(buf) {
  const rev = audioCtx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const src = buf.getChannelData(c), dst = rev.getChannelData(c);
    for (let i = 0, n = src.length; i < n; i++) dst[i] = src[n - 1 - i];
  }
  return rev;
}

// ---------- Avspilling ----------
// Pakker ut et JPEG-bilde til ImageBitmap (gjenbrukes hvis det allerede er gjort)
function decode(i) {
  if (cache.has(i)) return Promise.resolve(cache.get(i));
  if (decoding.has(i)) return decoding.get(i);
  const id = clipId;
  const p = createImageBitmap(frames[i].blob).then(bmp => {
    decoding.delete(i);
    if (id !== clipId) { bmp.close && bmp.close(); return null; }
    cache.set(i, bmp);
    return bmp;
  }).catch(() => { decoding.delete(i); return null; });
  decoding.set(i, p);
  return p;
}

// Hold bildene rett foran avspillingen klare, og kast dem som er vist
function prefetch(idx, step) {
  for (let k = 0; k <= AHEAD; k++) {
    const j = idx + step * k;
    if (j >= 0 && j < frames.length) decode(j);
  }
  cache.forEach((bmp, key) => {
    const behind = step > 0 ? key < idx - 1 : key > idx + 1;
    if (behind || Math.abs(key - idx) > AHEAD + 2) { bmp.close && bmp.close(); cache.delete(key); }
  });
}

// Spill av i valgt retning. destNode = valgfri lydmål (for eksport). onEnd kalles når én runde er ferdig.
let playToken = 0;
function startPlayback({ destNode = null, once = false, onEnd = null } = {}) {
  if (!hasClip()) return;
  stopPlayback();
  const token = ++playToken;
  playing = true;
  showLive(false);
  const fwd = direction === 'forward';
  const stepDir = fwd ? 1 : -1;
  const first = frames[0].t;
  const duration = frames[frames.length - 1].t - first;

  const runOnce = async () => {
    // Pakk ut de første bildene før klokka starter, så lyd og bilde går i takt
    const startIdx = fwd ? 0 : frames.length - 1;
    prefetch(startIdx, stepDir);
    await decode(startIdx);
    if (token !== playToken) return;
    const t0 = performance.now();
    if (currentAudio() && soundOn) {
      audioCtx.resume();
      playSource = audioCtx.createBufferSource();
      playSource.buffer = currentAudio();
      playSource.connect(destNode || audioCtx.destination);
      playSource.start();
    }
    let idx = startIdx;
    const step = () => {
      if (!playing || token !== playToken) return;
      const elapsed = performance.now() - t0;
      // tidspunkt i originalklippet
      const target = first + (fwd ? elapsed : duration - elapsed);
      if (fwd) while (idx < frames.length - 1 && frames[idx + 1].t <= target) idx++;
      else while (idx > 0 && frames[idx - 1].t >= target) idx--;
      prefetch(idx, stepDir);
      const bmp = cache.get(idx);
      if (bmp) ctx.drawImage(bmp, 0, 0, clipW, clipH); // ellers står forrige bilde til dette er klart
      progress.style.background = 'var(--blue)';
      progress.style.width = Math.min(100, elapsed / duration * 100) + '%';
      if (elapsed >= duration) {
        if (playSource) { try { playSource.stop(); } catch {} playSource = null; }
        if (!once && loopOn) { runOnce(); return; }
        playing = false; render(); onEnd && onEnd();
        return;
      }
      playRaf = requestAnimationFrame(step);
    };
    step();
  };
  runOnce();
}

function stopPlayback() {
  playing = false;
  playToken++;
  cancelAnimationFrame(playRaf);
  if (playSource) { try { playSource.stop(); } catch {} playSource = null; }
}

// ---------- Innstillinger ----------
function setDirection(dir) {
  direction = dir; saveSettings();
  if (hasClip()) startPlayback(); else render();
}
dirRev.onclick = () => setDirection('reverse');
dirFwd.onclick = () => setDirection('forward');

timerBtn.onclick = () => {
  timerSecs = TIMER_STEPS[(TIMER_STEPS.indexOf(timerSecs) + 1) % TIMER_STEPS.length];
  saveSettings(); render();
};
loopBtn.onclick = () => { loopOn = !loopOn; saveSettings(); render(); };
soundBtn.onclick = () => {
  soundOn = !soundOn; saveSettings();
  if (playing) startPlayback(); else render();
};

voiceBtn.onclick = () => { voicePanel.hidden = !voicePanel.hidden; render(); };
document.addEventListener('pointerdown', e => {
  if (!voicePanel.hidden && !voicePanel.contains(e.target) && !voiceBtn.contains(e.target)) { voicePanel.hidden = true; render(); }
});

function commitPitch() {
  if (+pitchInput.value === pitchSemis) { render(); return; }
  pitchSemis = +pitchInput.value; saveSettings();
  applyPitch();
  if (playing && !exporting) startPlayback(); // hør endringen med en gang
  else render();
}
pitchInput.addEventListener('input', render);
pitchInput.addEventListener('change', commitPitch);
pitchReset.onclick = () => { pitchInput.value = 0; commitPitch(); };

// ---------- Lagringsmappe (Chrome på datamaskin) ----------
// Chrome lar siden skrive til en mappe du velger. Valget huskes i IndexedDB.
function kv(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('revers', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}
const kvGet = k => kv('readonly', s => s.get(k));
const kvSet = (k, v) => kv('readwrite', s => s.put(v, k));

async function chooseDir() {
  try {
    dirHandle = await showDirectoryPicker({ id: 'revers-videoer', mode: 'readwrite', startIn: 'videos' });
  } catch (e) {
    return null; // avbrutt
  }
  try { await kvSet('dir', dirHandle); } catch (e) { console.warn('Kunne ikke huske mappen', e); }
  render();
  return dirHandle;
}

// Må kalles direkte fra et klikk, fordi Chrome bare spør om tilgang da.
async function ensureDir() {
  if (!dirHandle) return chooseDir();
  const opts = { mode: 'readwrite' };
  try {
    if (await dirHandle.queryPermission(opts) === 'granted') return dirHandle;
    if (await dirHandle.requestPermission(opts) === 'granted') return dirHandle;
  } catch (e) { console.warn(e); }
  return chooseDir(); // tilgang nektet eller mappen borte – velg på nytt
}

folderBtn.onclick = () => chooseDir();
if (fsSupported) kvGet('dir').then(h => { if (h) { dirHandle = h; render(); } }).catch(() => {});

async function writeToDir(dir, name, blob) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob);
  await w.close();
}

function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------- Lagring ----------
saveBtn.onclick = async () => {
  if (exporting || !hasClip()) return;
  // Spør om mappe/tilgang først, mens klikket fortsatt gjelder
  let dir = null;
  if (fsSupported) {
    dir = await ensureDir();
    if (!dir) return;
  }
  voicePanel.hidden = true;
  const vStream = out.captureStream(30);
  let dest = null;
  if (currentAudio() && soundOn) {
    dest = audioCtx.createMediaStreamDestination();
    dest.stream.getAudioTracks().forEach(t => vStream.addTrack(t));
  }
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(vStream, mimeType ? { mimeType, videoBitsPerSecond: 6e6 } : {});
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    const type = rec.mimeType || mimeType;
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const dirName = direction === 'forward' ? 'forlengs' : 'baklengs';
    const name = 'revers-' + dirName + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
    if (dir) {
      try {
        await writeToDir(dir, name, blob);
        toast(`Lagret i ${dir.name}`);
      } catch (e) {
        console.warn('Kunne ikke skrive til mappen', e);
        download(name, blob);
        toast('Lastet ned i stedet', false);
      }
    } else {
      const file = new File([blob], name, { type: blob.type });
      if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
        // Mobil: delingsmenyen lar deg lagre til Bilder/Galleri eller Filer.
        // Den må åpnes fra et trykk, så vi viser en knapp når videoen er klar.
        toastAction('Klar', 'Lagre', 'share-bold', async () => {
          try { await navigator.share({ files: [file], title: 'Revers' }); }
          catch (e) { if (e.name !== 'AbortError') { download(name, blob); toast('Lastet ned i stedet', false); } }
        });
      } else if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        // Lokal server (valgfri): lagrer i videoer/
        try {
          const res = await fetch('/save', { method: 'POST', headers: { 'X-Filename': name }, body: blob });
          if (!res.ok) throw new Error(res.status);
          toast('Lagret i ' + (await res.json()).saved.split('/')[0]);
        } catch (e) { download(name, blob); toast('Lastet ned', false); }
      } else {
        download(name, blob);
        toast('Lastet ned');
      }
    }
    exporting = false;
    render();
  };
  exporting = true;
  rec.start();
  startPlayback({ destNode: dest, once: true, onEnd: () => setTimeout(() => rec.stop(), 100) });
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !voicePanel.hidden) { voicePanel.hidden = true; render(); return; }
  if (e.code !== 'Space' || e.target.tagName === 'INPUT' || e.repeat) return;
  e.preventDefault();
  if (e.target.blur) e.target.blur(); // hindrer at en fokusert knapp også trykkes
  if (!mainBtn.disabled) mainBtn.click();
});

render();

// ---------- Installering (Chrome) ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker feilet', e));
}
let installPrompt = null;
const installBtn = $('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();          // vis vår egen knapp i stedet for Chromes standard
  installPrompt = e;
  installBtn.hidden = false;
});
installBtn.onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  installBtn.hidden = true;
};
window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
</script>
